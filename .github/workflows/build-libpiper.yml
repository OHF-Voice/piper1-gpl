---
name: Build libpiper

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'libpiper/**'
      - '.github/workflows/build-libpiper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'libpiper/**'
      - '.github/workflows/build-libpiper.yml'

defaults:
  run:
    shell: bash

jobs:
  format-check:
    name: Check Formatting
    # Runner images are pinned. clang-format and clang-tidy come from the
    # image's apt, and the code is formatted with clang-format 18, the version
    # in Ubuntu 24.04.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libpiper

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Configure for format check
        run: cmake -B build -DCLANG_FORMAT_ARGS="--dry-run;--Werror"

      - name: Run clang-format check
        run: cmake --build build --target format

  clang-tidy:
    name: Static Analysis (clang-tidy)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: libpiper

    steps:
      - uses: actions/checkout@v4

      - name: Install clang-tidy
        run: | 
          sudo apt-get update && sudo apt-get install -y clang-tidy
          clang-tidy --version

      - name: Configure and build with clang-tidy and Clang
        run: |
          # A regular build must not invoke the opt-in format target.
          cmake -B build -DPIPER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/install" -DENABLE_CLANG_TIDY=ON -DCLANG_FORMAT=/usr/bin/false
          cmake --build build --config Release
        env:
          CC: clang
          CXX: clang++

  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2025-vs2026]
    defaults:
      run:
        working-directory: libpiper

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DPIPER_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_INSTALL_PREFIX="$PWD/install"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest -C Release --output-on-failure --test-dir build 

      - name: Install
        run: cmake --install build --config Release

      - name: Check installed Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 1
        run: ./tests/check_installed_windows.ps1 -InstallPrefix ./install

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: libpiper-${{ matrix.os }}
          path: libpiper/install/
